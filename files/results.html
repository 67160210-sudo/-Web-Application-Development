<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลการวิเคราะห์ — ครัวชัวร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark">ค</span>ครัวชัวร์</a>
    <nav class="sitenav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="recipe.html">วิเคราะห์เมนู</a>
      <a href="results.html" class="current">ผลลัพธ์ล่าสุด</a>
    </nav>
  </header>

  <main id="mainWrap"></main>

  <div id="footWrap"></div>
</div>

<script src="app.js"></script>
<script>
  const state = loadState();
  const params = new URLSearchParams(window.location.search);
  const shouldRun = params.get("run") === "1";
  const mainWrap = document.getElementById("mainWrap");
  document.getElementById("footWrap").innerHTML = renderFooter();

  const railHtml = (activeIdx) => `
    <div class="narrow" style="max-width:1180px;">
      <div class="pagerail">
        <div class="pr-step done"><span class="num">1</span><span class="lbl">กรอกสูตร</span></div>
        <div class="pr-step ${activeIdx===2?'active':'done'}"><span class="num">2</span><span class="lbl">วิเคราะห์</span></div>
        <div class="pr-step ${activeIdx===3?'active':''}"><span class="num">3</span><span class="lbl">ผลลัพธ์</span></div>
      </div>
    </div>`;

  function renderEmpty(){
    mainWrap.innerHTML = `
      <div class="panel empty-state" style="margin-top:40px;">
        <svg class="es-icon" viewBox="0 0 64 64" fill="none"><rect x="10" y="6" width="44" height="52" rx="2" fill="#F0E7CE" stroke="#24392E" stroke-width="2"/><path d="M20 20h24M20 30h24M20 40h14" stroke="#C63D2F" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h2>ยังไม่มีสูตรอาหารให้วิเคราะห์</h2>
        <p>เริ่มจากหน้ากรอกสูตรอาหาร ตั้งชื่อเมนู เพิ่มวัตถุดิบ และระบุปริมาณ แล้วผลลัพธ์จะแสดงที่นี่โดยอัตโนมัติ</p>
        <a class="cta" href="recipe.html">ไปกรอกสูตรอาหาร
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>`;
  }

  function renderLoading(){
    mainWrap.innerHTML = `
      ${railHtml(2)}
      <div class="panel" style="margin-top:10px;">
        <div class="loading-wrap">
          <div class="pot">
            <div class="steam" style="left:30%; animation-delay:0s;"></div>
            <div class="steam" style="left:50%; animation-delay:.4s;"></div>
            <div class="steam" style="left:70%; animation-delay:.8s;"></div>
            <svg viewBox="0 0 64 64"><path d="M12 26h40l-3 26a4 4 0 0 1-4 4H19a4 4 0 0 1-4-4z" fill="#24392E"/><rect x="10" y="20" width="44" height="8" rx="2" fill="#DE9F2E"/><circle cx="32" cy="24" r="2" fill="#F7F1E1"/></svg>
          </div>
          <h3>กำลังคำนวณคุณค่าทางโภชนาการ...</h3>
          <p>ระบบกำลังรวมค่าพลังงานและสารอาหารจากวัตถุดิบทั้งหมดในสูตร ${esc(state.dishName)}</p>
          <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%;"></div></div>
        </div>
      </div>`;
    let p = 0;
    const fill = document.getElementById("progFill");
    const timer = setInterval(()=>{
      p += 14 + Math.random()*10;
      if(p >= 100){
        p = 100;
        clearInterval(timer);
        setTimeout(()=>{
          history.replaceState(null, "", "results.html");
          renderResults("calories");
        }, 300);
      }
      if(fill) fill.style.width = p + "%";
    }, 220);
  }

  let servingView = "total";

  function renderResults(activeTab){
    const {total, contributions} = computeTotals(state.ingredients);
    const servings = Math.max(1, state.servings||1);
    const recs = computeRecommendations({total, contributions}, servings);

    mainWrap.innerHTML = `
      ${railHtml(3)}
      <div class="layout" style="margin-top:10px;">
        <div class="panel">
          <div class="ticket-head"><span class="th-num">ใบสั่งวิเคราะห์ <span class="dot">·</span> ผลลัพธ์</span></div>
          <h2 class="section-title">ผลวิเคราะห์: ${esc(state.dishName)}</h2>
          <p class="section-desc">สรุปพลังงานและสารอาหารจากวัตถุดิบทั้งหมดในสูตร แบ่งเสิร์ฟทั้งหมด ${servings} ที่</p>

          <div class="tabbar">
            <button type="button" data-tab="calories" class="active">แคลอรีรวม</button>
            <button type="button" data-tab="detail">รายละเอียดสารอาหาร</button>
            <button type="button" data-tab="recs">คำแนะนำ</button>
          </div>

          <div class="tabpane active" id="pane-calories">
            <div class="serving-toggle" style="margin:0 0 30px; max-width:320px;">
              <button type="button" data-view="total" class="active">ต่อสูตรทั้งหมด</button>
              <button type="button" data-view="serving">ต่อ 1 ที่</button>
            </div>
            <div style="display:flex; justify-content:center; margin:8px 0 30px;">
              <div class="sticker-frame" style="transform:rotate(0.8deg); max-width:280px; padding:26px 30px;">
                <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C63D2F" stroke-width="2"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-5 2 1 3 4 3 6a5 5 0 0 1-10 0c0-5 3-6 5-10z"/></svg>
                  <span class="lc-label" style="font-size:14px; color:#8a8267;">พลังงานรวม</span>
                </div>
                <div style="text-align:center;">
                  <span class="mono" id="calBig" style="font-size:56px; font-weight:700; color:var(--chili); line-height:1;">${round(total.kcal)}</span>
                  <div style="font-size:13px; color:#8a8267; margin-top:4px;" id="calUnit">กิโลแคลอรี (ต่อสูตร ${servings} ที่)</div>
                </div>
              </div>
            </div>
            <p style="font-size:13.5px; color:#8a8267; text-align:center;">≈ ${round(total.kcal/servings)} กิโลแคลอรีต่อหนึ่งที่ ถ้าแบ่งเสิร์ฟ ${servings} ที่</p>
          </div>

          <div class="tabpane" id="pane-detail">
            <div class="result-hero">
              <span class="num-big" id="detailBig">${round(total.kcal)}</span>
              <span class="num-unit" id="detailUnit">กิโลแคลอรี (ต่อสูตร ${servings} ที่)</span>
            </div>
            <div id="barsWrap"></div>
          </div>

          <div class="tabpane" id="pane-recs">
            ${recs.map(r=>`
              <div class="rec-card ${r.warn?'warn':''}">
                <span class="ricon">${r.icon}</span>
                <div>
                  <h3>${esc(r.title)}</h3>
                  <p>${esc(r.text)}</p>
                  <span class="tag">${esc(r.tag)}</span>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="nav-buttons">
            <a class="btn-ghost" href="recipe.html">← กลับไปแก้ไขสูตร</a>
            <button class="btn-primary" id="restartBtn" type="button">เริ่มวิเคราะห์เมนูใหม่</button>
          </div>
        </div>

        <div id="labelWrap"></div>
      </div>`;

    function bar(label, val, ref, cls){
      const p = Math.min(100, (val/ref)*100);
      return `<div class="bar-group">
        <div class="bar-label"><span>${label}</span><span class="mono">${round(val,1)}</span></div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${p}%;"></div></div>
      </div>`;
    }

    function refreshServingDependent(){
      const useServing = servingView === "serving";
      const d = useServing ? {
        kcal: total.kcal/servings, protein: total.protein/servings, carb: total.carb/servings,
        fat: total.fat/servings, sugar: total.sugar/servings, sodium: total.sodium/servings
      } : total;
      document.getElementById("calBig").textContent = round(d.kcal);
      document.getElementById("calUnit").textContent = `กิโลแคลอรี ${useServing ? '(ต่อ 1 ที่)' : `(ต่อสูตร ${servings} ที่)`}`;
      document.getElementById("detailBig").textContent = round(d.kcal);
      document.getElementById("detailUnit").textContent = `กิโลแคลอรี ${useServing ? '(ต่อ 1 ที่)' : `(ต่อสูตร ${servings} ที่)`}`;
      document.getElementById("barsWrap").innerHTML =
        bar("โปรตีน (ก.)", d.protein, Math.max(RDI.protein, d.protein*1.2), "pandan") +
        bar("คาร์โบไฮเดรต (ก.)", d.carb, Math.max(RDI.carb, d.carb*1.2), "") +
        bar("น้ำตาล (ก.)", d.sugar, Math.max(RDI.sugar, d.sugar*1.2), "chili") +
        bar("ไขมัน (ก.)", d.fat, Math.max(RDI.fat, d.fat*1.2), "") +
        bar("โซเดียม (มก.)", d.sodium, Math.max(RDI.sodium, d.sodium*1.2), "chili");
      document.getElementById("labelWrap").innerHTML = renderLabelCard(state, {servingView, showToggle:true});
      document.querySelectorAll("[data-labelview]").forEach(el=>{
        el.addEventListener("click", ()=>{ servingView = el.dataset.labelview; refreshServingDependent(); syncToggles(); });
      });
    }

    function syncToggles(){
      document.querySelectorAll("[data-view]").forEach(el=>{
        el.classList.toggle("active", el.dataset.view === servingView);
      });
    }

    document.querySelectorAll("[data-view]").forEach(el=>{
      el.addEventListener("click", ()=>{ servingView = el.dataset.view; refreshServingDependent(); syncToggles(); });
    });

    document.querySelectorAll("[data-tab]").forEach(el=>{
      el.addEventListener("click", ()=>{
        document.querySelectorAll("[data-tab]").forEach(b=>b.classList.remove("active"));
        el.classList.add("active");
        document.querySelectorAll(".tabpane").forEach(p=>p.classList.remove("active"));
        document.getElementById("pane-"+el.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("restartBtn").addEventListener("click", ()=>{
      clearState();
      window.location.href = "recipe.html";
    });

    refreshServingDependent();

    if(activeTab && activeTab !== "calories"){
      document.querySelector(`[data-tab="${activeTab}"]`).click();
    }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  if(!state.dishName || state.ingredients.length === 0){
    renderEmpty();
  } else if(shouldRun){
    renderLoading();
  } else {
    renderResults("calories");
  }
</script>
</body>
</html>
