<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กรอกสูตรอาหาร — ครัวชัวร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark">ค</span>ครัวชัวร์</a>
    <nav class="sitenav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="recipe.html" class="current">วิเคราะห์เมนู</a>
      <a href="results.html">ผลลัพธ์ล่าสุด</a>
    </nav>
  </header>

  <main>
    <div class="narrow" style="max-width:1180px;">
      <div class="pagerail">
        <div class="pr-step active"><span class="num">1</span><span class="lbl">กรอกสูตร</span></div>
        <div class="pr-step"><span class="num">2</span><span class="lbl">วิเคราะห์</span></div>
        <div class="pr-step"><span class="num">3</span><span class="lbl">ผลลัพธ์</span></div>
      </div>
    </div>

    <div class="layout" style="margin-top:10px;">
      <div class="panel">
        <div class="ticket-head"><span class="th-num">ใบสั่งวิเคราะห์ <span class="dot">·</span> สูตรอาหาร</span></div>
        <h2 class="section-title">กรอกสูตรอาหาร</h2>
        <p class="section-desc">ตั้งชื่อเมนู เพิ่มวัตถุดิบทีละอย่างจากฐานข้อมูล แล้วระบุปริมาณของแต่ละอย่าง พิมพ์ชื่อวัตถุดิบภาษาไทย เช่น หมูสับ น้ำตาลทราย น้ำปลา</p>

        <div class="field">
          <label for="dishName">ชื่อเมนู</label>
          <input type="text" id="dishName" placeholder="เช่น ผัดกะเพราหมูสับ">
        </div>

        <div class="add-row">
          <div class="field">
            <label for="ingInput">เพิ่มวัตถุดิบ</label>
            <input type="text" id="ingInput" list="ingredientList" placeholder="พิมพ์ชื่อวัตถุดิบ...">
            <datalist id="ingredientList"></datalist>
          </div>
          <button class="btn-secondary" id="addIngBtn" type="button">+ เพิ่มวัตถุดิบ</button>
        </div>
        <div id="ingError" style="display:none;color:var(--chili);font-size:12.5px;margin-top:8px;"></div>

        <div id="chipsWrap"></div>

        <div id="qtyWrap" style="margin-top:30px;"></div>

        <div class="nav-buttons">
          <a class="btn-ghost" href="index.html">← กลับหน้าแรก</a>
          <button class="btn-primary" id="toResultsBtn" disabled>วิเคราะห์คุณค่าทางโภชนาการ →</button>
        </div>
      </div>

      <div id="labelWrap"></div>
    </div>
  </main>

  <div id="footWrap"></div>
</div>

<script src="app.js"></script>
<script>
  let state = loadState();

  const dishInput = document.getElementById("dishName");
  const ingInput = document.getElementById("ingInput");
  const addBtn = document.getElementById("addIngBtn");
  const errBox = document.getElementById("ingError");
  const toResultsBtn = document.getElementById("toResultsBtn");

  document.getElementById("footWrap").innerHTML = renderFooter();
  document.getElementById("ingredientList").innerHTML =
    Object.keys(DB).map(n=>`<option value="${esc(n)}">`).join("");

  function persist(){ saveState(state); }

  function renderChips(){
    const wrap = document.getElementById("chipsWrap");
    if(state.ingredients.length === 0){
      wrap.innerHTML = `<div class="empty-note">ยังไม่มีวัตถุดิบในสูตร ลองเริ่มด้วย "หมูสับ", "น้ำตาลทราย" หรือ "น้ำปลา"</div>`;
      return;
    }
    wrap.innerHTML = `<div class="chips">${state.ingredients.map((ing,i)=>`
      <span class="chip">${esc(ing.name)}<button type="button" data-remove="${i}" aria-label="ลบวัตถุดิบ">×</button></span>
    `).join("")}</div>`;
    wrap.querySelectorAll("[data-remove]").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.ingredients.splice(parseInt(el.dataset.remove,10),1);
        persist(); renderAll();
      });
    });
  }

  function renderQtyTable(){
    const wrap = document.getElementById("qtyWrap");
    if(state.ingredients.length === 0){ wrap.innerHTML = ""; return; }
    wrap.innerHTML = `
      <div class="field" style="max-width:220px;">
        <label for="servings">แบ่งเสิร์ฟกี่ที่</label>
        <input type="number" id="servings" min="1" step="1" value="${state.servings}">
      </div>
      <table class="qty-table">
        <thead><tr><th>วัตถุดิบ</th><th>ปริมาณ</th><th>หน่วย</th><th>เทียบกรัม</th></tr></thead>
        <tbody>
          ${state.ingredients.map((ing,i)=>`
          <tr>
            <td class="iname">${esc(ing.name)}</td>
            <td><input type="number" min="0" step="0.5" value="${ing.amount}" data-qty="${i}" style="width:80px;"></td>
            <td>
              <select data-unit="${i}">
                ${UNITS.map(u=>`<option value="${u}" ${u===ing.unit?'selected':''}>${u}</option>`).join("")}
              </select>
            </td>
            <td class="gramnote">≈ ${round(gramsOf(ing),1)} ก.</td>
          </tr>`).join("")}
        </tbody>
      </table>`;

    document.getElementById("servings").addEventListener("input", e=>{
      state.servings = Math.max(1, parseFloat(e.target.value)||1);
      persist(); renderLabel();
    });
    wrap.querySelectorAll("[data-qty]").forEach(el=>{
      el.addEventListener("input", e=>{
        const i = parseInt(el.dataset.qty,10);
        state.ingredients[i].amount = Math.max(0, parseFloat(e.target.value)||0);
        el.closest("tr").querySelector(".gramnote").textContent = `≈ ${round(gramsOf(state.ingredients[i]),1)} ก.`;
        persist(); renderLabel();
      });
    });
    wrap.querySelectorAll("[data-unit]").forEach(el=>{
      el.addEventListener("change", e=>{
        const i = parseInt(el.dataset.unit,10);
        state.ingredients[i].unit = e.target.value;
        el.closest("tr").querySelector(".gramnote").textContent = `≈ ${round(gramsOf(state.ingredients[i]),1)} ก.`;
        persist(); renderLabel();
      });
    });
  }

  function renderLabel(){
    document.getElementById("labelWrap").innerHTML = renderLabelCard(state, {note:"ตัวอย่างเบื้องต้น"});
  }

  function syncNav(){
    toResultsBtn.disabled = (!state.dishName.trim() || state.ingredients.length===0);
  }

  function renderAll(){
    renderChips(); renderQtyTable(); renderLabel(); syncNav();
  }

  dishInput.value = state.dishName;
  dishInput.addEventListener("input", e=>{ state.dishName = e.target.value; persist(); syncNav(); renderLabel(); });

  function addIngredient(){
    const val = ingInput.value.trim();
    if(!val) return;
    if(!DB[val]){
      errBox.style.display = "block";
      errBox.textContent = `ไม่พบ "${val}" ในฐานข้อมูล ลองเลือกจากรายการที่แนะนำ เช่น หมูสับ, น้ำตาลทราย, น้ำปลา, กระเทียม`;
      return;
    }
    errBox.style.display = "none";
    state.ingredients.push({name: val, amount: 1, unit: "ช้อนโต๊ะ"});
    ingInput.value = "";
    persist(); renderAll();
  }
  addBtn.addEventListener("click", addIngredient);
  ingInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addIngredient(); } });

  toResultsBtn.addEventListener("click", ()=>{
    if(toResultsBtn.disabled) return;
    persist();
    window.location.href = "results.html?run=1";
  });

  renderAll();
</script>
</body>
</html>
